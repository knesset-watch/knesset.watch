<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 152 88" role="img" aria-label="אפרכסת לכנסת">
  <title>אפרכסת לכנסת</title>
  <!--
    אוזן שמקשיבה לכנסת.

    ── מה נשמר מהגרסה של זויה ──────────────────────────────────────

    הדגל הוסר: האתר עוקב אחרי הכנסת בביקורתיות — מדד מורדים, מי לא
    עובד, מה הנתונים אינם אומרים — וסמל לאומי בלוגו קורא כהזדהות
    ממסדית. הבניין כבר מזהה את הכנסת בלי זה.

    הבניין צויר באותו משקל קו של האוזן. באיור מלא עם צללים ומדרגות
    השניים נראים כמו שני לוגואים שונים.

    סימן השאלה בתעלת האוזן הוא הלב של הסמל: הוא הופך "מקשיב" ל"שואל".

    ── מה השתנה ───────────────────────────────────────────────────

    צורת האוזן הותאמה ללוגו החדש שבסיידבר: מלאה ועגולה יותר, והתנוך
    מסתיים בוו שמתעקל שמאלה ולמעלה במקום ספירלה פתוחה. הסליל הפנימי
    גדל ועבר לחלק העליון-ימני, כמו בלוגו.

    זה צויר מחדש ולא הוקטן מהלוגו. הלוגו הוא איור עם גרדיאנטים
    וצללים, ובפאביקון של 16 פיקסל הוא נמרח לכתם — נבדק. כאן משקל
    הקו אחיד והצורה סגורה מספיק כדי להיקרא גם בגודל הזה.

    הצבעים הם נייבי #0E2140 ותכלת #3D6B8A ולא הקרם שבלוגו, כי
    הפאביקון יושב על לשונית בהירה וקרם עליה כמעט אינו נראה.
  -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">

    <!-- גלי קול -->
    <g stroke="#3D6B8A" stroke-width="6">
      <path d="M4 26 L15 31" />
      <path d="M2 43 L14 43" />
      <path d="M4 60 L15 55" />
    </g>

    <!-- האוזן — מתאר פתוח, מלא למעלה ומצר כלפי מטה -->
    <path stroke="#0E2140" stroke-width="7"
          d="M42 78
             C31 75, 24 62, 24 44
             C24 24, 38 10, 55 10
             C70 10, 78 24, 76 42
             C74 56, 67 67, 57 70" />

    <!-- התנוך — הוו שמתעקל שמאלה ולמעלה -->
    <path stroke="#0E2140" stroke-width="7"
          d="M42 78
             C35 81, 28 77, 29 69" />

    <!-- הסליל הפנימי -->
    <path stroke="#3D6B8A" stroke-width="6"
          d="M41 36
             C48 27, 61 29, 64 39
             C67 49, 61 57, 54 57" />

    <!-- סימן השאלה בתעלה -->
    <path stroke="#0E2140" stroke-width="5"
          d="M40 43
             C40 37, 45 34, 50 36
             C55 38, 55 45, 50 48
             C47 50, 46 52, 46 56" />
    <circle cx="46" cy="65" r="2.6" fill="#0E2140" stroke="none" />

    <!-- הכנסת — אותו משקל קו -->
    <g stroke="#0E2140" stroke-width="6">
      <!-- הגג -->
      <path d="M86 34 L116 22 L146 34" />
      <!-- הכרכוב -->
      <path d="M86 40 L146 40" />
      <!-- העמודים -->
      <path d="M94 46 L94 68" />
      <path d="M109 46 L109 68" />
      <path d="M123 46 L123 68" />
      <path d="M138 46 L138 68" />
      <!-- הבסיס -->
      <path d="M86 74 L146 74" />
    </g>
  </g>
</svg>
