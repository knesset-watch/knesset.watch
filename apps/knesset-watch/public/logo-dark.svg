<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 152 88" role="img" aria-label="אפרכסת לכנסת">
  <title>אפרכסת לכנסת</title>
  <!--
    אוזן שמקשיבה לכנסת.

    הדגל הוסר: האתר עוקב אחרי הכנסת בביקורתיות — מדד מורדים, מי לא
    עובד, מה הנתונים אינם אומרים — וסמל לאומי בלוגו קורא כהזדהות
    ממסדית. הבניין כבר מזהה את הכנסת בלי זה.

    הבניין צויר מחדש באותו משקל קו של האוזן. במקור הוא היה איור מלא
    עם צללים ומדרגות, והשניים נראו כמו שני לוגואים שונים.

    סימן השאלה בתעלת האוזן הוא הלב של הסמל: הוא הופך "מקשיב" ל"שואל".
  -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">

    <!-- גלי קול -->
    <g stroke="#3D6B8A" stroke-width="6">
      <path d="M4 26 L15 31" />
      <path d="M2 43 L14 43" />
      <path d="M4 60 L15 55" />
    </g>

    <!-- האוזן — הסליל החיצוני -->
    <path stroke="#F4F1E8" stroke-width="7"
          d="M64 10
             C40 10, 24 27, 24 46
             C24 64, 33 78, 44 78
             C52 78, 54 71, 51 63" />

    <!-- הסליל הפנימי -->
    <path stroke="#3D6B8A" stroke-width="6"
          d="M61 25
             C45 25, 36 37, 36 48
             C36 57, 41 62, 46 60" />

    <!-- סימן השאלה בתעלה -->
    <path stroke="#F4F1E8" stroke-width="5"
          d="M48 38
             C48 33, 52 30, 56 32
             C60 34, 60 40, 56 43
             C53 45, 52 47, 52 50" />
    <circle cx="52" cy="59" r="2.6" fill="#F4F1E8" stroke="none" />

    <!-- הכנסת — אותו משקל קו -->
    <g stroke="#F4F1E8" stroke-width="6">
      <!-- הגג -->
      <path d="M86 34 L116 22 L146 34" />
      <!-- הכרכוב -->
      <path d="M86 40 L146 40" />
      <!-- העמודים -->
      <path d="M94 46 L94 68" />
      <path d="M109 46 L109 68" />
      <path d="M123 46 L123 68" />
      <path d="M138 46 L138 68" />
      <!-- הבסיס -->
      <path d="M86 74 L146 74" />
    </g>
  </g>
</svg>
